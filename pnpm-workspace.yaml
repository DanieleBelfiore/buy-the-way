# jwks-rsa 4 (pulled in by firebase-admin 14) does a plain `require('jose')`
# in src/utils.js, but jose 6 is ESM-only ("type": "module", no require
# condition). In the deployed Lambda that throws ERR_REQUIRE_ESM at import
# time, killing every function before any of our code runs. jose 5 ships a
# real CJS build ("require": "./dist/node/cjs/index.js"), so pinning it here
# makes the require work on any Node version instead of depending on the
# runtime having require(esm).
#
# Safe because jwks-rsa only touches four long-stable jose symbols:
# decodeJwt, decodeProtectedHeader, exportSPKI, importJWK.
# Revisit when jwks-rsa switches to a dynamic import().
overrides:
  jose: ^5.10.0

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  vue-demi: true
minimumReleaseAgeExclude:
  - '@lottiefiles/dotlottie-vue@0.11.15'
  - '@lottiefiles/dotlottie-web@0.74.0'
  - '@typescript-eslint/eslint-plugin@8.60.0'
  - '@typescript-eslint/parser@8.60.0'
  - '@typescript-eslint/project-service@8.60.0'
  - '@typescript-eslint/scope-manager@8.60.0'
  - '@typescript-eslint/tsconfig-utils@8.60.0'
  - '@typescript-eslint/type-utils@8.60.0'
  - '@typescript-eslint/types@8.60.0'
  - '@typescript-eslint/typescript-estree@8.60.0'
  - '@typescript-eslint/utils@8.60.0'
  - '@typescript-eslint/visitor-keys@8.60.0'
  - '@vue/language-core@3.3.2'
  - resend@6.12.4
  - vue-tsc@3.3.2
