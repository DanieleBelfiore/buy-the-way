# Netlify deployment configuration for Buy The Way.
# Build is performed in GitHub Actions; Netlify serves the pre-built `dist/`.

[build]
  # Netlify is no longer git-connected - the Netlify CLI deploy in the
  # GitHub Actions `deploy-netlify` job uploads the dist/ artefact built
  # in `quality`. This `publish` line just tells the CLI which directory
  # to ship when `--dir` isn't passed explicitly.
  publish = "dist"
  # Empty command overrides whatever is still configured in the Netlify
  # dashboard UI (values in netlify.toml win). Without this, `netlify deploy`
  # in CI tries to run the dashboard's `pnpm run build`, which fails because
  # the deploy-only runner doesn't have pnpm installed.
  command = ""

# Serverless functions live in netlify/functions; the modern esbuild bundler
# handles the TS source, but `resend` and `firebase-admin` ship as ESM with
# package-export maps that esbuild silently externalises during bundling. The
# result is a deployed .mjs with bare `import 'resend'` statements that Node
# can't resolve at runtime (ERR_MODULE_NOT_FOUND). Declaring them as
# external_node_modules tells the bundler to leave the imports alone but
# include the matching `node_modules/` folders alongside the function so
# Node's loader finds them at `/var/task/node_modules/...` in production.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["resend", "firebase-admin"]
  included_files = [
    "node_modules/resend/**",
    "node_modules/firebase-admin/**",
    "node_modules/@firebase/**",
    "node_modules/firebase/**",
  ]

# SPA fallback - Vue Router uses HTML5 history; all unmatched paths serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for fingerprinted assets emitted by Vite/PWA.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must always revalidate so updates ship to existing users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Global security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Allow Firebase Auth popup (window.closed polling on cross-origin popup).
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'sha256-3+O/Btwx3rNlw4+lf6X8ToKvw6STzUfNTISIZ/gfOro=' 'wasm-unsafe-eval' blob: https://apis.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob: https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://*.firebasestorage.app;
      connect-src 'self' https://apis.google.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://cdn.jsdelivr.net https://unpkg.com;
      frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;
      manifest-src 'self';
      worker-src 'self' blob:;
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-ancestors 'none';
    """
