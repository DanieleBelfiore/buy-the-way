# Netlify deployment configuration for Buy The Way.
# Build is performed in GitHub Actions; Netlify serves the pre-built `dist/`.

[build]
  publish = "dist"
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "11"

# SPA fallback — Vue Router uses HTML5 history; all unmatched paths serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for fingerprinted assets emitted by Vite/PWA.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must always revalidate so updates ship to existing users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Global security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' https://apis.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob: https://lh3.googleusercontent.com;
      connect-src 'self' https://apis.google.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com;
      frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;
      manifest-src 'self';
      worker-src 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-ancestors 'none';
    """
