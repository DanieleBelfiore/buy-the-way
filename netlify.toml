# Netlify deployment configuration for Buy The Way.
# Build is performed in GitHub Actions; Netlify serves the pre-built `dist/`.

[build]
  # Netlify is no longer git-connected - the Netlify CLI deploy in the
  # GitHub Actions `deploy-netlify` job uploads the dist/ artefact built
  # in `quality`. This `publish` line just tells the CLI which directory
  # to ship when `--dir` isn't passed explicitly.
  publish = "dist"
  # Empty command overrides whatever is still configured in the Netlify
  # dashboard UI (values in netlify.toml win). Without this, `netlify deploy`
  # in CI tries to run the dashboard's `pnpm run build`, which fails because
  # the deploy-only runner doesn't have pnpm installed.
  command = ""

# No [build.environment] here on purpose. It applies to the build step, and
# this deploy has none (`command = ""`, dist/ arrives prebuilt from GitHub
# Actions), so anything set there never reaches the function bundler.
# AWS_LAMBDA_JS_RUNTIME lives on the deploy step's `env:` in
# .github/workflows/ci-cd.yml, which is the process the bundler actually runs in.

# Serverless functions live in netlify/functions; the modern esbuild bundler
# handles the TS source, but `resend` and `firebase-admin` ship as ESM with
# package-export maps that esbuild silently externalises during bundling. The
# result is a deployed .mjs with bare `import 'resend'` statements that Node
# can't resolve at runtime (ERR_MODULE_NOT_FOUND). Declaring them as
# external_node_modules tells the bundler to leave the imports alone but
# include the matching `node_modules/` folders alongside the function so
# Node's loader finds them at `/var/task/node_modules/...` in production.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["resend", "firebase-admin"]
  included_files = [
    "node_modules/resend/**",
    "node_modules/firebase-admin/**",
    "node_modules/@firebase/**",
    "node_modules/firebase/**",
  ]

# Firebase Auth handler, proxied onto our own origin. MUST stay above the SPA
# fallback: Netlify applies the first matching rule, so a catch-all placed
# earlier would swallow these and serve index.html instead.
#
# Why proxy at all: since firebase-js-sdk 9.15, signInWithRedirect is broken on
# Safari/iOS when `authDomain` is <project>.firebaseapp.com, because the SDK has
# to read back state it wrote on that third-party origin and ITP partitions it
# away. Serving the same handler from our own domain makes it first-party.
# Installed PWAs depend on the redirect flow (popups never report back in iOS
# standalone), so this proxy is what makes PWA sign-in work at all.
#
# Paired with VITE_FIREBASE_AUTH_DOMAIN=buy-the-way.danielebelfiore.dev in the
# production build env, AND with the matching redirect URI registered on the
# OAuth client in Google Cloud Console - without it Google answers 400
# redirect_uri_mismatch before the consent screen. See .claude/docs/firebase.md.
#
# The service worker already skips /__/* via `navigateFallbackDenylist` in
# src/pwa/manifest.ts.
#
# Do not add a [[headers]] block for this path: Netlify does not apply custom
# headers to responses proxied to an external host, so it would be dead config.
# Firebase Hosting's own headers reach the client, and they do not forbid
# framing - which is what the popup resolver's /__/auth/iframe needs.
[[redirects]]
  from = "/__/auth/*"
  to = "https://buy-the-way-2ac6e.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/__/firebase/*"
  to = "https://buy-the-way-2ac6e.firebaseapp.com/__/firebase/:splat"
  status = 200
  force = true

# SPA fallback - Vue Router uses HTML5 history; all unmatched paths serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Long-lived caching for fingerprinted assets emitted by Vite/PWA.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service worker must always revalidate so updates ship to existing users.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Global security headers.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Allow Firebase Auth popup (window.closed polling on cross-origin popup).
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Content-Security-Policy = """
      default-src 'self';
      script-src 'self' 'sha256-+FfCUey18trIgxxSGZuwRJ6cyp2aHKnEZBNWVwPhcnQ=' 'wasm-unsafe-eval' blob: https://apis.google.com https://www.gstatic.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self' data:;
      img-src 'self' data: blob: https://lh3.googleusercontent.com https://firebasestorage.googleapis.com https://*.firebasestorage.app;
      connect-src 'self' https://apis.google.com https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://cdn.jsdelivr.net https://unpkg.com;
      frame-src 'self' https://*.firebaseapp.com https://accounts.google.com;
      manifest-src 'self';
      worker-src 'self' blob:;
      base-uri 'self';
      form-action 'self';
      object-src 'none';
      frame-ancestors 'none';
    """
