<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-hidden="true">
  <!-- pot -->
  <path d="M40 96 L80 96 L76 112 L44 112 Z" fill="#A37551" stroke="#5a3f2a" stroke-width="2" stroke-linejoin="round"/>
  <rect x="38" y="92" width="44" height="6" rx="1" fill="#A37551" stroke="#5a3f2a" stroke-width="2"/>
  <!-- soil -->
  <ellipse cx="60" cy="94" rx="20" ry="2.5" fill="#5a3f2a" opacity="0.5"/>
  <!-- main cactus body -->
  <rect x="52" y="40" width="16" height="56" rx="8" fill="#6FA56C" stroke="#3f6f3d" stroke-width="2.5"/>
  <!-- ribs -->
  <path d="M56 46 L56 88 M60 44 L60 90 M64 46 L64 88" stroke="#3f6f3d" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- left arm -->
  <path d="M52 64 L42 64 Q36 64 36 70 L36 78 Q36 84 42 84 L52 84 Z" fill="#6FA56C" stroke="#3f6f3d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M40 70 L40 80" stroke="#3f6f3d" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- right arm -->
  <path d="M68 56 L78 56 Q84 56 84 62 L84 74 Q84 80 78 80 L68 80 Z" fill="#6FA56C" stroke="#3f6f3d" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M80 62 L80 74" stroke="#3f6f3d" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
  <!-- spikes -->
  <g stroke="#3f6f3d" stroke-width="1" stroke-linecap="round">
    <line x1="50" y1="50" x2="48" y2="48"/>
    <line x1="50" y1="60" x2="48" y2="58"/>
    <line x1="50" y1="74" x2="48" y2="72"/>
    <line x1="70" y1="46" x2="72" y2="44"/>
    <line x1="70" y1="58" x2="72" y2="56"/>
    <line x1="70" y1="72" x2="72" y2="70"/>
    <line x1="70" y1="84" x2="72" y2="82"/>
  </g>
</svg>
