<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Aggiungi, spunta, sincronizza con la famiglia. Mobile-first, installabile, offline-ready."
    />
    <!-- Unconditional fallbacks; inline hydration below overwrites to match the
         saved app theme (not the OS prefers-color-scheme) so Android PWA chrome
         stays cream in light mode even when the phone uses dark system UI. -->
    <meta name="theme-color" content="#f7f4ed" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/x-icon" href="/icons/favicon.ico" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn, Telegram, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Buy The Way" />
    <meta property="og:title" content="Buy The Way - La Tua Lista Della Spesa Intelligente" />
    <meta
      property="og:description"
      content="Aggiungi, spunta, sincronizza con la famiglia. Mobile-first, installabile, offline-ready."
    />
    <meta property="og:url" content="https://buy-the-way.danielebelfiore.dev" />
    <meta property="og:locale" content="it_IT" />
    <meta
      property="og:image"
      content="https://buy-the-way.danielebelfiore.dev/branding/logo_original_1200_630.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Buy The Way logo" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Buy The Way - La Tua Lista Della Spesa Intelligente" />
    <meta
      name="twitter:description"
      content="Aggiungi, spunta, sincronizza con la famiglia."
    />
    <meta
      name="twitter:image"
      content="https://buy-the-way.danielebelfiore.dev/branding/logo_original_1200_630.png"
    />

    <!-- Preconnect to third-party origins used early in load (Firebase Auth + Google sign-in). -->
    <link rel="preconnect" href="https://apis.google.com" crossorigin />
    <link rel="preconnect" href="https://buy-the-way-2ac6e.firebaseapp.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />

    <title>Buy The Way</title>
    <!--
      Inline theme hydration. Runs in <head> before first paint so surfaces,
      theme-color, and color-scheme match the saved app theme (not OS dark mode).
      Kept tiny + dependency-free on purpose.

      CSP-SENSITIVE: hash-allowlisted in netlify.toml script-src. After edits:
        1. Run `pnpm csp:hash`
        2. Replace the sha256-... token in netlify.toml
        3. Verify no CSP violation in DevTools
    -->
    <script>
      (function () {
        var themeColor = '#f7f4ed';
        var colorScheme = 'light';
        var resolved = 'light';
        try {
          var stored = localStorage.getItem('btw:themeMode');
          resolved = stored === 'dark' ? 'dark' : 'light';
        } catch (e) {
          resolved = 'light';
        }
        if (resolved === 'dark') {
          themeColor = '#15151a';
          colorScheme = 'dark';
        }
        document.documentElement.setAttribute('data-theme', resolved);
        function setMeta(name, content) {
          var el = document.querySelector('meta[name="' + name + '"]');
          if (!el) {
            el = document.createElement('meta');
            el.setAttribute('name', name);
            document.head.appendChild(el);
          }
          el.setAttribute('content', content);
        }
        setMeta('theme-color', themeColor);
        setMeta('color-scheme', colorScheme);
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>

    <!--
      Static Netlify Forms detector. Netlify scans the built HTML at deploy
      time, sees `data-netlify="true"`, and provisions a form endpoint that
      our SPA POSTs to (see FeedbackModal). The visually-hidden inputs declare
      every field name Netlify should accept. Do not remove.
    -->
    <form name="feedback" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="email" />
      <input type="text" name="uid" />
      <input type="text" name="userAgent" />
      <input type="text" name="appVersion" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
