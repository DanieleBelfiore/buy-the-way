name: Firebase deploy

# Netlify builds and deploys the SPA directly from git pushes to main.
# This workflow only deploys Firestore rules and indices, which need the
# firebase CLI and cannot run inside Netlify's build container.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: firebase-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  firebase-deploy:
    name: Deploy Firestore rules + indices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 26

      - name: Install firebase-tools
        # Pinned to a known-good minor; bump intentionally.
        run: npm install -g firebase-tools@13.29.1

      - name: Deploy firestore rules and indices
        run: |
          firebase deploy \
            --only firestore:rules,firestore:indexes \
            --project buy-the-way-2ac6e \
            --token "${{ secrets.FIREBASE_TOKEN }}" \
            --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
