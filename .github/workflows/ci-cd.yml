name: CI/CD

# Single pipeline: every gate runs first; production deploys only fire on
# pushes to main and only after every gate has passed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0
  CI: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate 1 - static checks + build artefact
  # ---------------------------------------------------------------------------
  quality:
    name: lint + typecheck + unit + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Detects drift between the sha256 hash allowlisted in netlify.toml's
      # CSP `script-src` and the actual body of every inline <script> in
      # index.html. CSP would otherwise silently block the modified script in
      # production and the theme would briefly flash the wrong colour before
      # Vue mounts.
      - name: CSP hash check
        run: pnpm csp:hash

      - name: Unit tests + coverage
        run: pnpm test:coverage

      # The README coverage badge reads a gist that shields.io renders through
      # its `endpoint` API. Republishing it here is what keeps the badge from
      # drifting into a lie: the number always comes from the run that just
      # passed the 80% threshold gate in vitest.config.ts.
      #
      # Gated on push-to-main because pull_request runs (forks especially) have
      # no access to GIST_TOKEN, and a PR must not overwrite main's badge.
      - name: Read branch coverage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: coverage
        run: |
          pct=$(node -p "require('./coverage/coverage-summary.json').total.branches.pct")
          echo "pct=$pct" >> "$GITHUB_OUTPUT"

      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@v1.9.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: ${{ vars.COVERAGE_GIST_ID }}
          filename: buy-the-way-coverage.json
          label: coverage
          message: ${{ steps.coverage.outputs.pct }}% branches
          valColorRange: ${{ steps.coverage.outputs.pct }}
          minColorRange: 60
          maxColorRange: 95

      - name: Build production bundle
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
        run: pnpm build

      # The deploy-netlify job downloads this artefact instead of rebuilding,
      # so the bytes that pass CI are exactly the bytes that go to prod.
      - name: Upload dist artefact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 3

  # ---------------------------------------------------------------------------
  # Gate 2 - Firestore rules
  # ---------------------------------------------------------------------------
  rules:
    name: firestore rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools
        run: pnpm add -g firebase-tools@latest

      - name: Run firestore rules tests against emulator
        run: pnpm test:rules

  # ---------------------------------------------------------------------------
  # Gate 3 - Playwright + axe (light + dark)
  #
  # Toggled by the repository variable `E2E_ENABLED`:
  #   GitHub → repo Settings → Secrets and variables → Actions → Variables
  #   → set `E2E_ENABLED = true` to gate deploys on e2e, anything else (or
  #   missing) skips this job.
  # When skipped, the deploy jobs still run because their `if:` accepts a
  # `skipped` result for `e2e` alongside `success`.
  # ---------------------------------------------------------------------------
  e2e:
    name: e2e (playwright + axe)
    if: ${{ vars.E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install firebase-tools
        run: pnpm add -g firebase-tools@latest

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e suite
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Deploy - Firestore rules + indices
  # Runs only on push to main, and only when every gate above has passed.
  # ---------------------------------------------------------------------------
  deploy-firebase:
    name: deploy firestore rules + indices
    needs: [quality, rules, e2e]
    # `!cancelled()` is mandatory whenever any needs-job can legitimately be
    # `skipped`: without a status-function call GitHub applies the default
    # "skip the dependent job when any needed job didn't succeed" rule and
    # never even evaluates this `if:`. With it, the explicit result checks
    # below run and let the deploy proceed when e2e is intentionally off.
    # quality + rules must still succeed; e2e is allowed to be skipped.
    if: |
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.quality.result == 'success'
      && needs.rules.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install firebase-tools
        run: npm install -g firebase-tools@latest

      - name: Deploy firestore rules + indices + storage rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/gcp-key.json
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          echo "bytes: $(wc -c < "$GOOGLE_APPLICATION_CREDENTIALS")"
          node -e "const c=require(process.env.GOOGLE_APPLICATION_CREDENTIALS); console.log('type:',c.type,'| project:',c.project_id,'| email_set:',!!c.client_email,'| pk_head:',JSON.stringify((c.private_key||'').slice(0,28)))"
          firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project buy-the-way-2ac6e \
            --non-interactive
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"

  # ---------------------------------------------------------------------------
  # Deploy - Netlify (SPA + functions)
  # Pulls the dist artefact built in `quality`, ships it together with the
  # netlify/functions/* source. Runs only on push to main after gates pass.
  # ---------------------------------------------------------------------------
  deploy-netlify:
    name: deploy netlify (spa + functions)
    needs: [quality, rules, e2e]
    # Same gating as deploy-firebase - see the comment there for why
    # `!cancelled()` is required when e2e can legitimately be skipped.
    if: |
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/main'
      && needs.quality.result == 'success'
      && needs.rules.result == 'success'
      && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      # `--config.node-linker=hoisted` forces pnpm to write a flat
      # node_modules layout (npm-style) instead of the default symlinked
      # .pnpm store. Netlify's zip-it-and-ship-it bundler doesn't follow
      # pnpm's symlink structure when bundling functions - packages like
      # `resend` are left as external imports and the deployed .mjs blows
      # up with ERR_MODULE_NOT_FOUND at runtime.
      - name: Install dependencies (hoisted for function bundling)
        run: pnpm install --frozen-lockfile --config.node-linker=hoisted

      - name: Download dist artefact
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Install Netlify CLI
        run: npm install -g netlify-cli@latest

      # Raw `netlify deploy` is the most reliable path here. The build step
      # is short-circuited by the empty `command = ""` in netlify.toml, so
      # the CLI just uploads the prebuilt artefact downloaded above.
      - name: Deploy to Netlify (production)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          # Lambda runtime for the functions. Set on the CLI process, not only
          # in netlify.toml: `[build.environment]` is applied to the build
          # step, and this deploy skips it (`command = ""`), so the bundler
          # would otherwise fall back to the site default.
          #
          # Must stay >= nodejs22.x. firebase-admin 14 -> jwks-rsa 4 does a
          # plain `require('jose')`, and jose 6 is ESM-only; require() of ESM
          # needs Node 22.12+. Below that every function dies with
          # ERR_REQUIRE_ESM at import, before any of our code runs.
          AWS_LAMBDA_JS_RUNTIME: nodejs22.x
        run: |
          APP_VERSION=$(node -p "require('./package.json').version")
          netlify deploy \
            --prod \
            --dir=dist \
            --functions=netlify/functions \
            --message="v${APP_VERSION} (${GITHUB_SHA::7}) via GitHub Actions" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --site="$NETLIFY_SITE_ID"
